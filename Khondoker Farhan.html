<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khondoker Farhan</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('https://source.unsplash.com/random/1920x1080?nature') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        .content {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .social-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .social-links a {
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .social-links a:hover {
            background: #0056b3;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .social-links a {
                padding: 8px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Khondoker Farhan</h1>
        <div class="social-links">
            <a href="https://www.facebook.com/tanzimur.rashid.2024" target="_blank">Facebook</a>
            <a href="https://x.com/Tanzimurrashid" target="_blank">X</a>
            <a href="https://www.instagram.com/tanzimurrashid/" target="_blank">Instagram</a>
        </div>
    </div>
</body>
</html>
